<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Warped Text on Background</title>
    <style>
        body { margin:0; overflow:hidden; font-family:sans-serif; }
        #ui {
            position: fixed; top:10px; left:10px;
            background: rgba(0,0,0,0.6); padding:10px;
            border-radius:6px; z-index:10; color:white;
        }
        textarea { width:200px; height:80px; display:block; margin-bottom:10px; }
        .corner-input { width:60px; }
        .corner-row { margin-bottom:5px; }
    </style>
</head>
<body>

<div id="ui">
    <textarea id="textInput">CANVAS\nPRINT</textarea>
    <p>Corner positions (pixels, top-left origin)</p>
    <div class="corner-row">TL: X <input type="number" class="corner-input" id="tlx" value="100"> Y <input type="number" class="corner-input" id="tly" value="100"></div>
    <div class="corner-row">TR: X <input type="number" class="corner-input" id="trx" value="700"> Y <input type="number" class="corner-input" id="try" value="100"></div>
    <div class="corner-row">BR: X <input type="number" class="corner-input" id="brx" value="700"> Y <input type="number" class="corner-input" id="bry" value="300"></div>
    <div class="corner-row">BL: X <input type="number" class="corner-input" id="blx" value="100"> Y <input type="number" class="corner-input" id="bly" value="300"></div>
</div>

<canvas id="bgCanvas"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/numeric/1.2.6/numeric.min.js"></script>
<script>
    // ------------------- Background -------------------
    const bgCanvas = document.getElementById("bgCanvas");
    const bgCtx = bgCanvas.getContext("2d");
    bgCanvas.width = window.innerWidth;
    bgCanvas.height = window.innerHeight;

    const bgImage = new Image();
    bgImage.src = "assets/artwork/evening-road-run.jpg";
    bgImage.onload = () => drawBackground();

    function drawBackground(){
        bgCtx.clearRect(0,0,bgCanvas.width,bgCanvas.height);
        bgCtx.drawImage(bgImage,0,0,bgCanvas.width,bgCanvas.height);
    }

    // ------------------- Three.js -------------------
    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(
        0, window.innerWidth, window.innerHeight, 0, -10, 10
    );
    camera.position.z = 1;

    const renderer = new THREE.WebGLRenderer({alpha:true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.domElement.style.position = "absolute";
    renderer.domElement.style.top = "0";
    renderer.domElement.style.left = "0";
    document.body.appendChild(renderer.domElement);

    // ------------------- Text canvas -------------------
    const TEXT_W = 1024;
    const TEXT_H = 256;
    const textCanvas = document.createElement("canvas");
    textCanvas.width = TEXT_W;
    textCanvas.height = TEXT_H;
    const ctx = textCanvas.getContext("2d");

    const textTexture = new THREE.CanvasTexture(textCanvas);
    textTexture.minFilter = THREE.LinearFilter;
    textTexture.magFilter = THREE.LinearFilter;

    function drawTextCanvas(text=document.getElementById("textInput").value){
        ctx.clearRect(0,0,TEXT_W,TEXT_H);
        ctx.fillStyle = "#fff";
        ctx.clearRect(0,0,TEXT_W,TEXT_H); // transparent
        ctx.fillStyle = "#fff";
        ctx.font = "bold 100px Arial Black,sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        const lines = text.split("\n");
        const lineHeight = 120;
        const totalHeight = lines.length*lineHeight;
        let y = TEXT_H/2 - totalHeight/2 + lineHeight/2;
        for(let line of lines){
            ctx.fillText(line, TEXT_W/2, y);
            y += lineHeight;
        }
        textTexture.needsUpdate = true;
    }

    // ------------------- Plane -------------------
    const geometry = new THREE.PlaneGeometry(TEXT_W, TEXT_H);
    const material = new THREE.ShaderMaterial({
        uniforms: {
            map: { value: textTexture },
            Hinv: { value: new THREE.Matrix3() },
        },
        vertexShader: `
    varying vec2 vUv;
    void main(){
      // vUv in pixels
      vUv = uv * vec2(${TEXT_W.toFixed(1)}, ${TEXT_H.toFixed(1)});
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
    }
  `,
        fragmentShader: `
    uniform sampler2D map;
    uniform mat3 Hinv;
    varying vec2 vUv;
    void main(){
      vec3 p = Hinv * vec3(vUv,1.0);
      vec2 uv = p.xy / p.z / vec2(${TEXT_W.toFixed(1)}, ${TEXT_H.toFixed(1)});
      if(uv.x<0.0 || uv.x>1.0 || uv.y<0.0 || uv.y>1.0) discard;
      gl_FragColor = texture2D(map, uv);
    }
  `,
        transparent: true
    });
    const mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);
    mesh.position.set(TEXT_W/2, TEXT_H/2, 0);

    // ------------------- Corner inputs -------------------
    function getCorners(){
        const ids = [['tlx','tly'],['trx','try'],['brx','bry'],['blx','bly']];
        return ids.map(([xid,yid])=>{
            return { x: parseFloat(document.getElementById(xid).value), y: parseFloat(document.getElementById(yid).value) };
        });
    }

    // ------------------- Homography -------------------
    function computeHomography(src,dst){
        const X=[], Y=[];
        for(let i=0;i<4;i++){
            const xs=src[i].x, ys=src[i].y;
            const xd=dst[i].x, yd=dst[i].y;
            X.push([xs,ys,1,0,0,0,-xs*xd,-ys*xd]);
            X.push([0,0,0,xs,ys,1,-xs*yd,-ys*yd]);
            Y.push(xd); Y.push(yd);
        }
        const h = numeric.solve(X,Y);
        h.push(1);
        const H = new THREE.Matrix3();
        H.set(h[0],h[1],h[2], h[3],h[4],h[5], h[6],h[7],h[8]);
        return H;
    }

    function updateHomography(){
        const srcQuad = [
            {x:0,y:0},{x:TEXT_W,y:0},{x:TEXT_W,y:TEXT_H},{x:0,y:TEXT_H}
        ];
        const dstQuad = getCorners();
        const H = computeHomography(srcQuad,dstQuad);
        H.invert();
        material.uniforms.Hinv.value.copy(H);
    }

    // ------------------- Event listeners -------------------
    document.getElementById("textInput").addEventListener("input", e=>{
        drawTextCanvas(e.target.value);
        updateHomography();
    });
    document.querySelectorAll(".corner-input").forEach(input=>{
        input.addEventListener("input", updateHomography);
    });

    // ------------------- Animate -------------------
    drawTextCanvas();
    updateHomography();

    function animate(){
        requestAnimationFrame(animate);
        drawBackground();
        renderer.render(scene,camera);
    }
    animate();
</script>

</body>
</html>

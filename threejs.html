<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>True Quad Warp (Homography – Fixed Drag)</title>
    <style>
        body { margin: 0; background: #eaeaea; font-family: sans-serif; }
        #ui {
            position: fixed;
            top: 10px;
            left: 10px;
            background: white;
            padding: 10px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

<div id="ui">
    <input id="textInput" value="CANVAS PRINT">
    <div style="font-size:12px">Drag corner dots</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>

<script>
    const PLANE_W = 800;
    const PLANE_H = 200;

    /* =====================================================
       Scene
    ===================================================== */
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf0f0f0);

    const camera = new THREE.OrthographicCamera(-500, 500, 300, -300, 1, 2000);
    camera.position.z = 1000;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    /* =====================================================
       Text canvas
    ===================================================== */
    const TEXT_W = 2048;
    const TEXT_H = 512;
    const textCanvas = document.createElement("canvas");
    textCanvas.width = TEXT_W;
    textCanvas.height = TEXT_H;
    const ctx = textCanvas.getContext("2d");

    function drawText(t) {
        ctx.fillStyle = "#fff";
        ctx.fillRect(0,0,TEXT_W,TEXT_H);
        ctx.fillStyle = "#000";
        ctx.font = "bold 180px Arial Black, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(t, TEXT_W/2, TEXT_H/2);
    }
    drawText("CANVAS PRINT");

    const texture = new THREE.CanvasTexture(textCanvas);

    /* =====================================================
       Homography math
    ===================================================== */
    function computeHomography(src, dst) {
        const A = [];
        for (let i = 0; i < 4; i++) {
            const {x,y} = src[i];
            const {x:X,y:Y} = dst[i];
            A.push(
                [x,y,1,0,0,0,-x*X,-y*X,X],
                [0,0,0,x,y,1,-x*Y,-y*Y,Y]
            );
        }

        for (let i=0;i<8;i++) {
            let max=i;
            for (let j=i+1;j<8;j++)
                if (Math.abs(A[j][i]) > Math.abs(A[max][i])) max=j;
            [A[i],A[max]]=[A[max],A[i]];
            const p=A[i][i];
            for (let k=i;k<9;k++) A[i][k]/=p;
            for (let j=0;j<8;j++) if (j!==i){
                const f=A[j][i];
                for (let k=i;k<9;k++) A[j][k]-=f*A[i][k];
            }
        }

        return new Float32Array([
            A[0][8],A[1][8],A[2][8],
            A[3][8],A[4][8],A[5][8],
            A[6][8],A[7][8],1
        ]);
    }

    /* =====================================================
       Shader (true projective quad)
    ===================================================== */
    const material = new THREE.ShaderMaterial({
        uniforms:{
            map:{value:texture},
            H:{value:new THREE.Matrix3()}
        },
        vertexShader:`
    varying vec2 vUv;
    void main(){
      vUv=uv;
      gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);
    }
  `,
        fragmentShader:`
    uniform sampler2D map;
    uniform mat3 H;
    varying vec2 vUv;
    void main(){
      vec3 p=H*vec3(vUv,1.);
      vec2 uv=p.xy/p.z;
      if(any(lessThan(uv,vec2(0)))||any(greaterThan(uv,vec2(1))))
        discard;
      gl_FragColor=texture2D(map,uv);
    }
  `,
        transparent:true
    });

    /* =====================================================
       Quad
    ===================================================== */
    const quad = new THREE.Mesh(
        new THREE.PlaneGeometry(PLANE_W, PLANE_H),
        material
    );
    scene.add(quad);

    /* =====================================================
       Corner handles (FIX)
    ===================================================== */
    const handleGeo = new THREE.CircleGeometry(8,16);
    const handleMat = new THREE.MeshBasicMaterial({color:0xff0000});
    const handles = [];

    const handlePositions = [
        new THREE.Vector3(-PLANE_W/2,  PLANE_H/2, 0),
        new THREE.Vector3( PLANE_W/2,  PLANE_H/2, 0),
        new THREE.Vector3( PLANE_W/2, -PLANE_H/2, 0),
        new THREE.Vector3(-PLANE_W/2, -PLANE_H/2, 0)
    ];

    handlePositions.forEach(p => {
        const h = new THREE.Mesh(handleGeo, handleMat);
        h.position.copy(p);
        quad.add(h);              //<-- parent to quad
        handles.push(h);
    });

    /* =====================================================
       Update homography
    ===================================================== */
    const srcQuad = [
        {x:0,y:0},{x:1,y:0},{x:1,y:1},{x:0,y:1}
    ];

    function updateHomography() {
        const dst = handles.map(h => ({
            x: (h.position.x + PLANE_W / 2) / PLANE_W,
            y: 1.0 - (h.position.y + PLANE_H / 2) / PLANE_H
        }));

        const HsrcToDst = computeHomography(srcQuad, dst);

        // 🔑 INVERT THE HOMOGRAPHY
        const H = new THREE.Matrix3().fromArray(HsrcToDst);
        H.invert();

        material.uniforms.H.value.copy(H);
    }

    updateHomography();

    /* =====================================================
       Dragging (FIXED)
    ===================================================== */
    const raycaster=new THREE.Raycaster();
    const mouse=new THREE.Vector2();
    let active=null;

    window.addEventListener("mousedown",e=>{
        mouse.x=(e.clientX/window.innerWidth)*2-1;
        mouse.y=-(e.clientY/window.innerHeight)*2+1;
        raycaster.setFromCamera(mouse,camera);
        const hit=raycaster.intersectObjects(handles);
        if(hit.length) active=hit[0].object;
    });

    window.addEventListener("mousemove", e => {
        if (!active) return;

        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);

        const plane = new THREE.Plane(new THREE.Vector3(0,0,1), 0);
        const hit = new THREE.Vector3();
        raycaster.ray.intersectPlane(plane, hit);

        quad.worldToLocal(hit);     // <-- convert to plane-local space
        active.position.copy(hit);

        updateHomography();
    });


    window.addEventListener("mouseup",()=>active=null);

    /* =====================================================
       Editable text
    ===================================================== */
    textInput.oninput=e=>{
        drawText(e.target.value);
        texture.needsUpdate=true;
    };

    /* =====================================================
       Render
    ===================================================== */
    (function anim(){
        requestAnimationFrame(anim);
        renderer.render(scene,camera);
    })();
</script>
</body>
</html>

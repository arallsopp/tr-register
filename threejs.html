<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Text Warp Over Background</title>
    <style>
        body { margin:0; overflow:hidden; background:#eee; font-family:sans-serif; }
        #ui {
            position: fixed;
            top:10px; left:10px;
            background:white; padding:10px; border-radius:6px;
        }
        #textInput { width:200px; height:80px; }
    </style>
</head>
<body>

<div id="ui">
    <textarea id="textInput">CANVAS\nPRINT</textarea>
    <div style="font-size:12px;">Drag red corners</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/numeric/1.2.6/numeric.min.js"></script>

<script>
    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-500,500,300,-300,1,2000);
    camera.position.z = 1000;

    const renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // -------------------- Background Image --------------------
    const bgTexture = new THREE.TextureLoader().load('assets/artwork/evening-road-run.jpg');
    const bgGeometry = new THREE.PlaneGeometry(1000, 600);
    const bgMaterial = new THREE.MeshBasicMaterial({ map: bgTexture });
    const bgMesh = new THREE.Mesh(bgGeometry, bgMaterial);
    bgMesh.position.z = -1; // behind text
    scene.add(bgMesh);

    // -------------------- Text Canvas --------------------
    const TEXT_W = 1024, TEXT_H = 256;
    const textCanvas = document.createElement("canvas");
    textCanvas.width = TEXT_W;
    textCanvas.height = TEXT_H;
    const ctx = textCanvas.getContext("2d");

    const textTexture = new THREE.CanvasTexture(textCanvas);
    textTexture.minFilter = THREE.LinearFilter;
    textTexture.magFilter = THREE.LinearFilter;

    function drawText(text) {
        ctx.clearRect(0,0,TEXT_W,TEXT_H);

        // transparent background
        ctx.fillStyle = "rgba(0,0,0,0)";
        ctx.fillRect(0,0,TEXT_W,TEXT_H);

        // draw multi-line text
        const lines = text.split("\n");
        ctx.fillStyle = "#000";
        ctx.font = "bold 100px Arial Black,sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        const lineHeight = 120;
        const totalHeight = lines.length * lineHeight;
        let y = TEXT_H/2 - totalHeight/2 + lineHeight/2;
        for (let line of lines) {
            ctx.fillText(line, TEXT_W/2, y);
            y += lineHeight;
        }

        textTexture.needsUpdate = true;
    }

    // initial draw
    drawText(document.getElementById("textInput").value);

    // -------------------- Distorted Text Plane --------------------
    const PLANE_W = 800, PLANE_H = 200;
    const geometry = new THREE.PlaneGeometry(PLANE_W, PLANE_H,1,1);

    const material = new THREE.ShaderMaterial({
        uniforms: {
            map: { value: textTexture },
            Hinv: { value: new THREE.Matrix3() }
        },
        vertexShader: `
    varying vec2 vUv;
    void main(){
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
    }
  `,
        fragmentShader: `
    uniform sampler2D map;
    uniform mat3 Hinv;
    varying vec2 vUv;
    void main(){
      vec3 p = Hinv * vec3(vUv,1.0);
      vec2 uv = p.xy / p.z;
      if(uv.x<0.0||uv.x>1.0||uv.y<0.0||uv.y>1.0) discard;
      gl_FragColor = texture2D(map, uv);
    }
  `,
        transparent:true
    });

    const mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);

    // -------------------- Corner Handles --------------------
    const corners = [
        new THREE.Vector2(-PLANE_W/2, PLANE_H/2),  // TL
        new THREE.Vector2( PLANE_W/2, PLANE_H/2),  // TR
        new THREE.Vector2( PLANE_W/2,-PLANE_H/2),  // BR
        new THREE.Vector2(-PLANE_W/2,-PLANE_H/2)   // BL
    ];

    const handleGeo = new THREE.CircleGeometry(8,16);
    const handleMat = new THREE.MeshBasicMaterial({color:0xff0000});
    const handles = [];

    corners.forEach((c,i)=>{
        const h = new THREE.Mesh(handleGeo,handleMat);
        h.position.set(c.x,c.y,1);
        h.userData.index = i;
        scene.add(h);
        handles.push(h);
    });

    // -------------------- Homography --------------------
    function computeHomography(src,dst){
        const X = [], Y=[];
        for(let i=0;i<4;i++){
            const xs=src[i].x,ys=src[i].y;
            const xd=dst[i].x,yd=dst[i].y;
            X.push([xs,ys,1,0,0,0,-xs*xd,-ys*xd]);
            X.push([0,0,0,xs,ys,1,-xs*yd,-ys*yd]);
            Y.push(xd); Y.push(yd);
        }
        const h = numeric.solve(X,Y);
        h.push(1);
        const H = new THREE.Matrix3();
        H.set(h[0],h[1],h[2],h[3],h[4],h[5],h[6],h[7],h[8]);
        return H;
    }

    function updateHomography(){
        const srcQuad = [{x:0,y:1},{x:1,y:1},{x:1,y:0},{x:0,y:0}];
        const dstQuad = corners.map(c=>({x:(c.x+PLANE_W/2)/PLANE_W,y:(c.y+PLANE_H/2)/PLANE_H}));
        const H = computeHomography(srcQuad,dstQuad);
        H.invert();
        material.uniforms.Hinv.value.copy(H);
    }

    // -------------------- Dragging --------------------
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let active=null;

    window.addEventListener("mousedown", e=>{
        mouse.x=(e.clientX/window.innerWidth)*2-1;
        mouse.y=-(e.clientY/window.innerHeight)*2+1;
        raycaster.setFromCamera(mouse,camera);
        const hit = raycaster.intersectObjects(handles);
        if(hit.length) active = hit[0].object;
    });

    window.addEventListener("mousemove", e=>{
        if(!active) return;
        mouse.x=(e.clientX/window.innerWidth)*2-1;
        mouse.y=-(e.clientY/window.innerHeight)*2+1;
        raycaster.setFromCamera(mouse,camera);
        const plane = new THREE.Plane(new THREE.Vector3(0,0,1),0);
        const p = new THREE.Vector3();
        raycaster.ray.intersectPlane(plane,p);
        const i = active.userData.index;
        corners[i].set(p.x,p.y);
        active.position.set(p.x,p.y,1);
        updateHomography();
    });

    window.addEventListener("mouseup",()=>active=null);

    // -------------------- Editable Text --------------------
    document.getElementById("textInput").addEventListener("input", e=>{
        drawText(e.target.value);
    });

    // -------------------- Animation --------------------
    updateHomography();
    (function animate(){
        requestAnimationFrame(animate);
        renderer.render(scene,camera);
    })();
</script>

</body>
</html>

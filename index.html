<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>

    <!-- image config -->
    <script src="assets/images.js"></script>

    <!-- Primary Meta Tags -->
    <title>Dorset TR Register Poster Maker</title>
    <meta name="title" content="Dorset TR Register Poster Maker">
    <meta name="description" content="Create tailored posters by overlaying text.">

    <!-- Open Graph / Facebook / LinkedIn / WhatsApp -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://arallsopp.github.io/tr-register/">
    <meta property="og:title" content="Dorset TR Register Poster Maker">
    <meta property="og:description" content="Create tailored posters by overlaying text.">
    <meta property="og:image" content="https://arallsopp.github.io/tr-register/assets/examples/redsign%20roadrun.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:site_name" content="Dorset TR Register">

    <!-- Favicon -->
    <!-- Standard favicon.ico -->
    <link rel="icon" href="assets/icons/favicon.ico" type="image/x-icon">

    <!-- Additional PNG favicon for better scaling -->
    <link rel="icon" href="assets/icons/favicon-16x16.png" sizes="16x16" type="image/png">
    <link rel="icon" href="assets/icons/favicon-32x32.png" sizes="32x32" type="image/png">

    <!-- Apple Touch Icon (for iOS devices) -->
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">

    <!-- Android Chrome App Icon -->
    <link rel="icon" href="assets/icons/android-chrome-192x192.png" sizes="192x192" type="image/png">


    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://arallsopp.github.io/tr-register/">
    <meta name="twitter:title" content="Dorset TR Register Poster Maker">
    <meta name="twitter:description" content="Create tailored posters by overlaying text.">
    <meta name="twitter:image" content="https://arallsopp.github.io/tr-register/assets/examples/redsign%20roadrun.jpg">

    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Damion&family=Harmattan:wght@600&family=Racing+Sans+One&display=swap" rel="stylesheet">

    <!-- custom styles -->
    <link rel="stylesheet" href="overlay-text.css">
</head>
<body data-bs-theme="dark">
<div class="container-fluid">
    <div class="row mt-3">
        <div class="col-12 col-sm-5 col-md-4 mb-3">
            <div class="scroll-column">
                <h2>Poster Maker</h2>
                <small>Prepared for Dorset TR Register by Andy Allsopp</small>
                <hr/>

                <!-- Controls to pick image and enter text -->
                <div class="mb-2">
                    <label for="imageChoice" class="form-label">Choose an Image:</label> <select class="form-select"
                                                                                                 id="imageChoice"></select>
                </div>
                <div class="mb-2 upload-only visually-hidden">
                    <input class="form-control" type="file" id="imageUpload" accept="image/*"/>
                </div>
                <div class="accordion" id="accordionControls">
                   <div class="accordion-item">
                        <h2 class="accordion-header" id="imageTextHeading">
                            <button class="accordion-button" type="button" data-bs-toggle="collapse"
                                    data-bs-target="#imageTextPanel" aria-expanded="true"
                                    aria-controls="imageTextPanel">Image Text
                            </button>
                        </h2>
                        <div id="imageTextPanel" class="accordion-collapse show"
                             aria-labelledby="imageTextHeading" data-bs-parent="#accordionControls">
                            <div class="accordion-body">
                                <div class="mb-2">
                                    <label for="userText" class="form-label d-block">Text to Add: <span
                                            id="line-count-preference"
                                            class="float-end"></span> </label>
                                    <textarea class="form-control" id="userText" rows="4">Your text here</textarea>
                                </div>
                                <div class="row mb-2 non-overlay">
                                    <!-- Controls for adjusting the X and Y position -->
                                    <div class="col">
                                        <label for="textX" class="form-label">Position X</label>
                                        <input type="number" id="textX" class="form-control" min="-1500" max="1500"
                                               step="1" value="450"/>
                                    </div>
                                    <div class="col">
                                        <label for="textY" class="form-label">Position Y</label>
                                        <input type="number" id="textY" class="form-control" min="-1500" max="1500"
                                               step="1" value="850"/>
                                    </div>
                                    <div class="col">
                                        <label for="scale" class="form-label">Scale</label>
                                        <input type="number" id="scale" class="form-control" min="0.1" max="3"
                                               step="0.1" value="1"/>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- hidden image upload options -->
                    <div class="accordion-item upload-only visually-hidden"><!-- hidden by default, revealed  when selected  -->
                        <h2 class="accordion-header" id="uploadedImageHeading">
                            <button class="accordion-button" type="button" data-bs-toggle="collapse"
                                    data-bs-target="#uploadedImagePanel" aria-expanded="true"
                                    aria-controls="uploadedImagePanel">External Image Options
                            </button>
                        </h2>
                        <div id="uploadedImagePanel" class="accordion-collapse show"
                             aria-labelledby="uploadedImageHeading" data-bs-parent="#accordionControls">
                            <div class="accordion-body">

                                <div class="form-check mb-2">
                                    <input class="form-check-input" type="checkbox" value="" id="overlayToggle"> <label
                                        class="form-check-label" for="overlayToggle"> Overlay Sign Post </label>
                                </div>
                                <div class="row mb-2k">
                                    <div class="col">
                                        <label for="cropX" class="form-label">Image Crop X</label>
                                        <input class="form-range" type="range" id="cropX" min="0" max="1"
                                               step="0.001" value="0.5">
                                    </div>
                                    <div class="col">
                                        <label for="cropY" class="form-label">Image Crop Y</label>
                                        <input class="form-range" type="range" id="cropY" min="0" max="1"
                                               step="0.001" value="0.5">
                                    </div>
                                </div>

                                <div class="row mb-2 overlay-only">
                                    <div class="col">
                                        <label for="overlayOffsetX" class="form-label">Sign Offset X</label>
                                        <input class="form-range" type="range" id="overlayOffsetX" min="-200" max="1000"
                                               value="0">
                                    </div>
                                    <div class="col">
                                        <label for="overlayOffsetY" class="form-label">Sign Offset Y</label>
                                        <input class="form-range" type="range" id="overlayOffsetY" min="-500" max="1000"
                                               value="0">
                                    </div>
                                    <div class="col">
                                        <label for="overlayScale" class="form-label">Sign Scale</label>
                                        <input class="form-range" type="range" id="overlayScale" min="0" max="3"
                                               step="0.01" value="1">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="accordion-item">
                        <h2 class="accordion-header" id="textDistortionHeader">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                                    data-bs-target="#textDistortionPanel" aria-expanded="false" aria-controls="textDistortionPanel">
                                Text Distortion
                            </button>
                        </h2>
                        <div id="textDistortionPanel" class="accordion-collapse collapse" aria-labelledby="textDistortionHeader"
                             data-bs-parent="#accordionControls">
                            <div class="accordion-body">

                                <div class="row mb-2">
                                    <!-- controls for adjusting the rotation and scale -->
                                    <div class="col">
                                        <label for="rotate" class="form-label">Rotation</label>
                                        <input type="number" id="rotate" class="form-control"  min="-359" max="359"
                                               step="0.5" value="0"/>
                                    </div>

                                    <!-- controls for controlling 3D-like skew effect -->
                                    <div class="col">
                                        <label for="skewX" class="form-label">Skew X</label> <input
                                            type="number" id="skewX" class="form-control" min="-1" max="1" step="0.01"
                                            value="0"/>
                                    </div>
                                    <div class="col">
                                        <label for="skewY" class="form-label">Skew Y</label>
                                        <input type="number" id="skewY" class="form-control" min="-1" max="1"
                                               step="0.01" value="0"/>
                                    </div>
                                </div>

                            </div>
                        </div>
                    </div>

                    <div class="accordion-item">
                        <h2 class="accordion-header" id="perspectiveHeader">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                                    data-bs-target="#perspectivePanel" aria-expanded="false" aria-controls="perspectivePanel">
                                Perspective Distortion
                            </button>
                        </h2>
                        <div id="perspectivePanel" class="accordion-collapse collapse" aria-labelledby="perspectiveHeader"
                             data-bs-parent="#accordionControls">

                            <div class="control-group">
                                <label>
                                    <input type="checkbox" id="perspectiveToggle">
                                    Enable Perspective
                                </label>
                            </div>

                            <div class="control-group perspective-control">
                                <label>
                                    <input type="checkbox" id="perspectiveEditMode">
                                    Edit Mode (Show Handles)
                                </label>
                            </div>

                            <div class="perspective-control">
                                <h4>Corner Positions</h4>

                                <div class="control-group">
                                    <label>Top-Left X:</label>
                                    <input type="number" id="cornerTLX" value="0">
                                    <label>Y:</label>
                                    <input type="number" id="cornerTLY" value="0">
                                </div>

                                <div class="control-group">
                                    <label>Top-Right X:</label>
                                    <input type="number" id="cornerTRX" value="400">
                                    <label>Y:</label>
                                    <input type="number" id="cornerTRY" value="0">
                                </div>

                                <div class="control-group">
                                    <label>Bottom-Right X:</label>
                                    <input type="number" id="cornerBRX" value="400">
                                    <label>Y:</label>
                                    <input type="number" id="cornerBRY" value="200">
                                </div>

                                <div class="control-group">
                                    <label>Bottom-Left X:</label>
                                    <input type="number" id="cornerBLX" value="0">
                                    <label>Y:</label>
                                    <input type="number" id="cornerBLY" value="200">
                                </div>
                            </div>

                            <h4>Fixed Dimensions</h4>

                            <div class="control-group">
                                <label for="perspectiveMaxWidth">Max Width (px):</label>
                                <input type="number" id="perspectiveMaxWidth" class="form-control" placeholder="Auto" min="0" step="10">
                                <small class="form-text text-muted">Lock width to prevent text size changes</small>
                            </div>

                            <div class="control-group">
                                <label for="perspectiveMaxLines">Max Lines:</label>
                                <input type="number" id="perspectiveMaxLines" class="form-control" placeholder="Auto" min="1" max="10" step="1">
                                <small class="form-text text-muted">Lock height for consistent line count</small>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
            <button id="saveBtn" class="btn btn-primary w-100 ">Save Image</button>
            <button id="resetTemplateBtn" class="btn btn-warning w-100 mb-2">Reset from Template</button>
        </div>
        <div class="col-12 col-sm-7 col-md-8 mb-3 sticky-column">
            <div class="text-center">
                <!-- Canvas Element -->
                <div class="canvas-container">
                    <canvas id="myCanvas"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="overlay-text.js"></script>
</body>
</html>

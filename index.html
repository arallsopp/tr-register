<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>
    <title>TR Register Dorset Poster Maker</title>
    <link rel="stylesheet" href="overlay-text.css">
</head>
<body data-bs-theme="dark">
<div class="container-fluid">
    <div class="row mt-3">
        <div class="col-12 col-sm-5 col-md-4">
            <h2>Image Compositor</h2>
            <small>Prepared for Dorset TR Register by Andy Allsopp</small>
            <hr/>

            <!-- Controls to pick image and enter text -->
            <div class="mb-2">
                <label for="imageChoice" class="form-label">Choose an Image:</label>
                <select class="form-select" id="imageChoice"></select>
            </div>
            <div class="mb-2">
                <label for="userText" class="form-label d-block">Text to Add:
                    <span id="line-count-preference" class="float-end"></span>
                </label>
                <textarea class="form-control" id="userText" rows="3">Your text here</textarea>
            </div>
            <div class="accordion" id="accordionExample">
                <div class="accordion-item">
                    <h2 class="accordion-header" id="headingOne">
                        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                                data-bs-target="#collapseOne" aria-expanded="false" aria-controls="collapseOne">
                            Advanced Options
                        </button>
                    </h2>
                    <div id="collapseOne" class="accordion-collapse collapse" aria-labelledby="headingOne"
                         data-bs-parent="#accordionExample">
                        <div class="accordion-body">

                            <div class="row mb-2">
                                <!-- Controls for adjusting the X and Y position -->
                                <div class="col">
                                    <label for="textX" class="form-label">Position X</label>
                                    <input type="number" id="textX" class="form-control" min="0" max="1500" step="1"
                                           value="450"/>
                                </div>
                                <div class="col">
                                    <label for="textY" class="form-label">Position Y</label>
                                    <input type="number" id="textY" class="form-control" min="0" max="1500" step="1"
                                           value="850"/>
                                </div>
                            </div>

                            <div class="row mb-2">
                                <!-- controls for adjusting the rotation and scale -->
                                <div class="col">
                                    <label for="rotate" class="form-label">Rotation</label>
                                    <input type="number" id="rotate" class="form-control" min="-359" max="359"
                                           step="0.5" value="0"/>
                                </div>
                                <div class="col">
                                    <label for="scale" class="form-label">Scale</label>
                                    <input type="number" id="scale" class="form-control" min="0.1" max="3" step="0.1"
                                           value="1"/>
                                </div>
                            </div>
                            <div class="row mb-2">
                                <!-- controls for controlling 3D-like skew effect -->
                                <div class="col"><label for="skewX" class="form-label">Skew X</label>
                                    <input type="number" id="skewX" class="form-control" min="-1" max="1" step="0.01"
                                           value="0"/>
                                </div>
                                <div class="col">
                                    <label for="skewY" class="form-label">Skew Y</label>
                                    <input type="number" id="skewY" class="form-control" min="-1" max="1" step="0.01"
                                           value="0"/>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="mb-5 mt-3">
                <button id="loadExampleBtn" class="btn btn-outline-primary">Load Example</button>
                <button id="saveBtn" class="btn btn-primary">Save Image</button>
            </div>
        </div>
        <div class="col-12 col-sm-7 col-md-8">
            <div class="text-center">
                <!-- Canvas Element -->
                <div class="canvas-container">
                    <canvas id="myCanvas"></canvas>
                </div>
            </div>
        </div>
    </div>

</div>


<script src="overlay-text.js"></script>
</body>
</html>

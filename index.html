<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overlay Text on Image with Custom Font</title>
    <link rel="stylesheet" href="overlay-text.css">
</head>
<body>
<!-- Controls to pick image and enter text -->
<div class="controls">
    <label for="imageChoice">Choose an Image:</label>
    <select id="imageChoice"></select>

    <br><br>

    <label for="userText">Enter Text:</label>
    <input type="text" id="userText" placeholder="Enter your text here" value="Your name here">

    <br><br>

    <button id="generateBtn">Generate Image</button>
    <button id="saveBtn">Save Image</button>
</div>

<!-- Canvas Element -->
<div class="scaledown">
    <canvas id="myCanvas"></canvas>
</div>


<script src="overlay-text.js"></script>
</body>
</html>

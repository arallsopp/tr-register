<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overlay Text on Image with Custom Font</title>

    <style>
        @font-face {
            font-family: 'chalkboard';
            src: url('assets/fonts/chalkboard.woff2') format('woff2');
        }

        body {
            font-family: Arial, sans-serif;
        }
    </style>

</head>
<body>

<!-- Canvas Element -->
<canvas id="myCanvas" width="1536" height="1024"></canvas>

<!-- Button to Save Image -->
<button id="saveBtn">Save Image</button>

<script>
    // Get the canvas element and its context
    const canvas = document.getElementById('myCanvas');
    const ctx = canvas.getContext('2d');

    // Load the image
    const image = new Image();
    image.src = 'assets/artwork/pub-lunch-landscape-master.png';

    // Wait until the font is loaded before rendering text
    document.fonts.load('75px chalkboard').then(function() {
        // When the font is loaded, we can proceed with drawing the image and text
        image.onload = () => {
            // Draw the image on the canvas once it loads
            ctx.drawImage(image, 0, 0, canvas.width, canvas.height);

            // Set the custom font for the text
            ctx.font = '75px chalkboard'; // Use the custom font
            ctx.fillStyle = 'white'; // Text color
            ctx.textAlign = 'left'; // Left align the text
            ctx.textBaseline = 'middle'; // Center vertically
            ctx.fillText('Your names here', 450,850);
        };
    });

    // Save the image with the overlay text
    document.getElementById('saveBtn').onclick = () => {
        const dataUrl = canvas.toDataURL('image/png');

        // Create a temporary link to trigger the download
        const link = document.createElement('a');
        link.href = dataUrl;
        link.download = 'tailored poster.png'; // Name of the downloaded file
        link.click();
    };
</script>

</body>
</html>

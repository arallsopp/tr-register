<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- UIkit CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uikit@3.25.4/dist/css/uikit.min.css" />

    <!-- UIkit JS -->
    <script src="https://cdn.jsdelivr.net/npm/uikit@3.25.4/dist/js/uikit.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/uikit@3.25.4/dist/js/uikit-icons.min.js"></script>

    <link rel="stylesheet" href="overlay-text.css">
</head>
<body>
<!-- Controls to pick image and enter text -->
<!--HEADER-->
<header id="site-head">
    <div class="uk-container uk-container-expand">
        <h2>Image Compositor</h2>
        For Dorset TR Register
    </div>
</header>
<!--/HEADER-->
<div class="spacer"></div>
<!--CARDS WRAPPER-->
<section class="uk-section uk-section-small uk-section-default uk-padding-remove-bottom">
    <div class="uk-container uk-container-expand uk-margin-large-bottom">
        <ul class="uk-tab" uk-tab="connect: #my-tabs-content">
            <li><a href="#">Image Creation</a></li>
            <li><a href="#">Advanced</a></li>
        </ul>

        <ul id="my-tabs-content" class="uk-switcher uk-margin">
            <li>
                <form class="uk-form-horizontal uk-margin-large">

                    <div class="uk-margin">
                        <label class="uk-form-label" for="form-horizontal-text">Text</label>
                        <div class="uk-form-controls">
                            <input class="uk-input" id="form-horizontal-text" type="text" placeholder="Some text...">
                        </div>
                    </div>

                    <div class="uk-margin">
                        <label class="uk-form-label" for="form-horizontal-select">Select</label>
                        <div class="uk-form-controls">
                            <select class="uk-select" id="form-horizontal-select">
                                <option>Option 01</option>
                                <option>Option 02</option>
                            </select>
                        </div>
                    </div>

                    <div class="uk-margin">
                        <div class="uk-form-label">Radio</div>
                        <div class="uk-form-controls uk-form-controls-text">
                            <label><input class="uk-radio" type="radio" name="radio1"> Option 01</label><br>
                            <label><input class="uk-radio" type="radio" name="radio1"> Option 02</label>
                        </div>
                    </div>

                </form>
            </li>
            <li>Content for Tab 2</li>
        </ul>
    </div>
</section>
<!--/CARDS WRAPPER-->
<!--FOOTER-->
<footer id="site-foot" class="uk-section uk-section-secondary uk-section-xsmall">
    <div class="uk-container uk-text-small uk-text-center">
        <a href="https://github.com/zzseba78/Kick-Off">Created by KickOff</a> | Built with <a href="http://getuikit.com" title="Visit UIkit 3 site" target="_blank" data-uk-tooltip><span data-uk-icon="uikit"></span></a>
    </div>
</footer>

<div class="controls">
    <label for="imageChoice">Choose an Image:</label>
    <select id="imageChoice"></select>

    <br/><label for="userText">Enter Text:</label>
    <textarea id="userText" rows="4" placeholder="Line one
Line two
Line three">Your text here</textarea>

    <!-- Sliders for adjusting the X and Y position -->
    <br><label for="textX">Text X Position</label>
    <input type="number" id="textX" min="0" max="1500" step="1" value="450" />

    <br><label for="textY">Text Y Position</label>
    <input type="number" id="textY" min="0" max="1500" step="1" value="850" />

    <!-- Sliders for adjusting the rotation and scale -->
    <br><label for="rotate">Text Rotation (degrees)</label>
    <input type="number" id="rotate" min="0" max="360" step="1" value="0" />

    <br><label for="scale">Text Scale</label>
    <input type="number" id="scale" min="0.5" max="3" step="0.1" value="1" />

    <!-- Skew Sliders for controlling 3D-like skew effect -->
    <br><label for="skewX">Skew X</label>
    <input type="number" id="skewX" min="-1" max="1" step="0.01" value="0" />

    <br><label for="skewY">Skew Y</label>
    <input type="number" id="skewY" min="-1" max="1" step="0.01" value="0" />

    <button id="generateBtn">Generate Image</button>
    <button id="saveBtn">Save Image</button>
</div>

<!-- Canvas Element -->
<div class="scaledown">
    <canvas id="myCanvas"></canvas>
</div>


<script src="overlay-text.js"></script>
</body>
</html>

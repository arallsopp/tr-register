<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <title>Overlay Text on Image with Custom Font</title>
    <link rel="stylesheet" href="overlay-text.css">
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <div class="col">
            <!-- Controls to pick image and enter text -->
            <label for="imageChoice" class="form-label">Choose an Image:</label>
            <select class="form-select" id="imageChoice"></select>

             <label for="userText" class="form-label">Enter Text:</label>
            <textarea class="form-control" id="userText" rows="3">Your text here</textarea>

            <!-- Controls for adjusting the X and Y position -->
            <label for="textX" class="form-label">Text X Position</label>
            <input type="number" id="textX" class="form-control" min="0" max="1500" step="1" value="450" />

            <label for="textY" class="form-label">Text Y Position</label>
            <input type="number" id="textY" class="form-control" min="0" max="1500" step="1" value="850" />

            <!-- controls for adjusting the rotation and scale -->
            <label for="rotate" class="form-label">Text Rotation (degrees)</label>
            <input type="number" id="rotate" class="form-control" min="0" max="360" step="1" value="0" />

            <label for="scale" class="form-label">Text Scale</label>
            <input type="number" id="scale" class="form-control" min="0.5" max="3" step="0.1" value="1" />

            <!-- Skew Sliders for controlling 3D-like skew effect -->
            <label for="skewX" class="form-label">Skew X</label>
            <input type="number" id="skewX" class="form-control" min="-1" max="1" step="0.01" value="0" />

            <label for="skewY" class="form-label">Skew Y</label>
            <input type="number" id="skewY" class="form-control" min="-1" max="1" step="0.01" value="0" />

            <button id="generateBtn" class="btn btn-secondary">Generate Image</button>
            <button id="saveBtn" class="btn btn-primary">Save Image</button>

        </div>
        <div class="col">
            <div class="text-center">
            <!-- Canvas Element -->
            <div class="canvas-container">
                <canvas id="myCanvas"></canvas>
            </div>
            </div>
        </div>
    </div>

</div>




<script src="overlay-text.js"></script>
</body>
</html>

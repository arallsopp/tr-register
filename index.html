<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overlay Text on Image with Custom Font</title>

    <!-- Define the Custom Font -->
    <style>
        @font-face {
            font-family: 'chalkboard';
            src: url('assets/fonts/chalkboard.woff2') format('woff');
        }

        body {
            font-family: Arial, sans-serif;
        }

        .controls {
            margin-top: 10px;
        }

        input[type="text"] {
            width: 300px;
        }
    </style>
</head>
<body>

<!-- Canvas Element -->
<canvas id="myCanvas"></canvas>

<!-- Controls to pick image and enter text -->
<div class="controls">
    <label for="imageChoice">Choose an Image:</label>
    <select id="imageChoice">
        <option value="image1" selected>Image 1</option>
        <option value="image2">Image 2</option>
    </select>

    <br><br>

    <label for="userText">Enter Text:</label>
    <input type="text" id="userText" placeholder="Enter your text here">

    <br><br>

    <button id="generateBtn">Generate Image</button>
    <button id="saveBtn">Save Image</button>
</div>

<script src="overlay-text.js"></script>
</body>
</html>
